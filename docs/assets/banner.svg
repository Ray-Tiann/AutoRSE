<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="248" viewBox="0 0 1440 248" role="img" aria-labelledby="title desc">
  <title id="title">AutoRSE</title>
  <desc id="desc">An evaluation framework for autonomous recommendation research agents.</desc>
  <defs>
    <radialGradient id="wash">
      <stop stop-color="#e4f0f3" stop-opacity=".8"/>
      <stop offset="1" stop-color="#f9fbfd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent">
      <stop stop-color="#4e8b94"/>
      <stop offset="1" stop-color="#315d7d"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="248" rx="16" fill="#f9fbfd"/>
  <ellipse cx="140" cy="124" rx="400" ry="230" fill="url(#wash)"/>
  <ellipse cx="1300" cy="124" rx="400" ry="230" fill="url(#wash)"/>
  <rect x="690" y="38" width="60" height="3" rx="1.5" fill="url(#accent)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="720" y="143" font-size="96" font-weight="700" letter-spacing="-3" fill="#182b3d">Auto<tspan fill="#315d7d">RSE</tspan></text>
    <text x="720" y="196" font-size="27" font-weight="400" fill="#526779">Evaluating autonomous recommendation research agents</text>
  </g>
</svg>
