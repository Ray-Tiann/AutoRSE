      <g stroke="#99f6e4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="21" y="26" width="38" height="29" rx="6"/><path d="M40 18v8m-10 29v7m20-7v7m-19-24h1m16 0h1m-16 9h14"/>
        <path d="M177 27h34m-27 0v25c0 10 20 10 20 0V27m-20 17h20M189 18h14"/>
