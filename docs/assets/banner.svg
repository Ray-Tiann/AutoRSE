<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="300" viewBox="0 0 1440 300" role="img" aria-labelledby="title desc">
  <title id="title">AutoRSE — A framework for evaluating recommendation research agents</title>
  <desc id="desc">AutoRSE connects your agent to six recommendation tasks, reproducible experiments, and hosted evaluation.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102542"/><stop offset="1" stop-color="#173f59"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dbeafe" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1440" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1440" height="300" rx="20" fill="url(#grid)"/>
  <g transform="translate(55 65)">
    <rect width="84" height="84" rx="22" fill="#dbeafe" fill-opacity=".08" stroke="#93c5fd" stroke-opacity=".3"/>
    <g fill="none" stroke="url(#accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m27 27-12 15 12 15m30-30 12 15-12 15M47 23 37 61"/>
      <path d="M18 67h47l-8-8m8 8-8 8" stroke-width="3"/>
    </g>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="163" y="126" font-size="70" font-weight="750" letter-spacing="-2" fill="#fff">AutoRSE</text>
    <text x="57" y="195" font-size="28" font-weight="500" fill="#e0f2fe">A framework for evaluating</text>
    <text x="57" y="235" font-size="28" font-weight="500" fill="#e0f2fe">autonomous recommendation research agents.</text>
    <g font-size="15" font-weight="700" letter-spacing="1.4" text-anchor="middle">
      <rect x="912" y="53" width="216" height="38" rx="19" fill="#5eead4" fill-opacity=".12"/>
      <text x="1020" y="78" fill="#99f6e4">BRING YOUR AGENT</text>
      <rect x="1144" y="53" width="236" height="38" rx="19" fill="#93c5fd" fill-opacity=".12"/>
      <text x="1262" y="78" fill="#bfdbfe">RUN REAL EXPERIMENTS</text>
    </g>
    <g transform="translate(931 127)">
      <g stroke="#789ab6" stroke-width="2"><path d="M53 44h91m72 0h91" fill="none"/><path d="m133 38 11 6-11 6m163-12 11 6-11 6" fill="none"/></g>
