schema_version = "1.3"
artifacts = [
  { source = "/workspace/artifact", destination = "workspace/artifact" },
  { source = "/workspace/datasets/criteo5m/working/submission.npz", destination = "workspace/datasets/criteo5m/working/submission.npz" },
  { source = "/workspace/baseline", destination = "workspace/baseline", exclude = ["__pycache__", "*.pyc"] },
]

[task]
name = "autorse/rankmixer"
description = "Improve the RANKMIXER baseline using public validation. Local verifier checks format only; submit predictions for hosted scoring."
keywords = ["recommendation", "research", "gpu", "format-only"]

[metadata]
category = "machine-learning"
difficulty = "hard"
local_metric = "format_valid_not_official_score"

[agent]
timeout_sec = 44100.0
network_mode = "public"
user = "root"

[verifier]
timeout_sec = 300.0
network_mode = "no-network"
environment_mode = "separate"
user = "root"

[verifier.env]
TASK_NAME = "rankmixer"
SUBMISSION_REL = "datasets/criteo5m/working/submission.npz"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
workdir = "/tests"

[environment]
network_mode = "public"
build_timeout_sec = 7200.0
cpus = 8
memory_mb = 65536
storage_mb = 102400
workdir = "/workspace"

[environment.env]
PYTHONUNBUFFERED = "1"
