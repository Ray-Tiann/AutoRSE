name: Public release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-harbor.txt -r space/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/run_baseline.py --task hstu --dry-run
      - run: python tools/run_agent.py --task hstu --agent codex --model example/model --dry-run
