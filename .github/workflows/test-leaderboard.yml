name: Test leaderboard tooling

on:
  pull_request:
    paths: ["leaderboard/**", "hf-leaderboard/**", ".github/workflows/*leaderboard.yml"]
  push:
    branches: [main]
    paths: ["leaderboard/**", "hf-leaderboard/**", ".github/workflows/*leaderboard.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r leaderboard/requirements.txt
      - run: python -m unittest discover -s leaderboard/tests -v
        env:
          PYTHONPATH: leaderboard
